<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>חדי הקרן</title>
<style>html,body{margin:0;height:100%;background:#8FD3F4;overflow:hidden}svg{width:100%;height:100%;display:block}</style></head>
<body><svg id="s" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg>
<script type="module">
import { unicorn, UNICORNS } from '../src/art/unicorns.js';
import { createUnicorn } from '../src/engine/unicorn.js';
const s = document.getElementById('s');
s.innerHTML = `<rect width="1600" height="1000" fill="#8FD3F4"/><rect y="820" width="1600" height="180" fill="#9BE38A"/><path d="M0,820 H1600" stroke="#3A2160" stroke-width="4"/>` +
  Object.keys(UNICORNS).map((k, i) => `<g transform="translate(${300 + i * 500},860) scale(1.05)" id="u-${k}">${unicorn(k)}</g>
  <text x="${300 + i * 500 + 30}" y="960" font-size="44" font-family="Rubik,sans-serif" font-weight="700" text-anchor="middle" fill="#3A2160">${UNICORNS[k].name}</text>`).join('');
const U = Object.keys(UNICORNS).map((k, i) => createUnicorn(s.querySelector('#u-' + k), { level: [5, 3, 1][i] }));
const q = new URLSearchParams(location.search);
const modes = (q.get('modes') || 'idle,fly,cheer').split(',');
U.forEach((u, i) => u.mode(modes[i] || 'idle', 0));
window.renderAt = (t) => U.forEach((u) => u.render(t));
if (q.has('render')) { renderAt(0.4); window.READY = true; }
else { const t0 = performance.now(); const loop = () => { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); }
</script></body></html>
